[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "foodspace"
version = "0.1.0"
description = "Cluster and visualize a dietary database by GIFT group, nutrient content and semantics"
requires-python = ">=3.10"
dependencies = ["numpy", "pandas", "scipy", "scikit-learn", "pyyaml", "igraph", "leidenalg"]

[project.optional-dependencies]
umap = ["umap-learn"]
semantics = ["sentence-transformers"]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]

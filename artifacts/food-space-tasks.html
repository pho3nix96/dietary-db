<style id="page-style">
/* Layout: one reading column; a progress header, then the six project phases in order, each a checklist. */
:root{

}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111716; --surface:#192120; --ink:#e3eae6; --muted:#93a29c; --line:#2a3532;
  --accent:#6fc3a7; --accent-soft:#1d3430; --warn:#e0a35a; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#111716; --surface:#192120; --ink:#e3eae6; --muted:#93a29c; --line:#2a3532;

}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
.wrap{max-width:760px;margin:0 auto;padding-block:40px 64px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));

header{display:flex;flex-direction:column;gap:10px}
.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
h1{font-family:var(--f-display);font-weight:650;font-size:clamp(28px,5vw,40px);line-height:1.1;margin:0;text-wrap:balance;letter-spacing:-.01em}
.lede{margin:0;color:var(--muted);max-width:62ch}
.meter{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:6px}
.bar{flex:1 1 220px;height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.bar span{display:block;height:100%;background:var(--accent);border-radius:4px;transition:width .3s ease}
.count{font-family:var(--f-mono);font-size:13px;font-variant-numeric:tabular-nums;color:var(--muted)}
.status{font-size:13px;color:var(--muted)}
.status.warn{color:var(--warn)}
.phases{display:flex;flex-direction:column;gap:18px}
section.phase{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px 20px;display:flex;flex-direction:column;gap:10px}
.ph-head{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:baseline}
.num{font-family:var(--f-mono);font-size:13px;color:var(--accent);font-variant-numeric:tabular-nums}
h2{font-family:var(--f-display);font-weight:600;font-size:19px;margin:0;line-height:1.25;text-wrap:balance}
.ph-count{font-family:var(--f-mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.ph-count.full{color:var(--accent)}
.note{margin:0;color:var(--muted);font-size:13.5px;max-width:65ch}
ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
li{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:start;padding:7px 0;border-top:1px solid var(--line)}
li:first-child{border-top:0}
.check{appearance:none;-webkit-appearance:none;width:18px;height:18px;margin:2px 0 0;border:1.5px solid var(--muted);border-radius:4px;background:var(--surface);cursor:pointer;display:grid;place-content:center;flex:none}
.check:checked{background:var(--accent);border-color:var(--accent)}
.check:checked::after{content:"";width:9px;height:5px;border-left:2px solid var(--surface);border-bottom:2px solid var(--surface);transform:rotate(-45deg) translate(1px,-1px)}
.check:focus-visible,.del:focus-visible,.add input:focus-visible,.add button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.txt{min-width:0;overflow-wrap:anywhere;cursor:pointer}
li.done .txt{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--line)}
.del{border:0;background:none;color:var(--muted);font-size:16px;line-height:1;padding:2px 6px;border-radius:4px;cursor:pointer;opacity:.55}
.del:hover{opacity:1;background:var(--accent-soft)}
.add{display:flex;gap:8px;margin-top:4px}
.add input{flex:1;min-width:0;font:inherit;font-size:14px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:7px 10px}
.add input::placeholder{color:var(--muted)}
.add button{font:inherit;font-size:13px;font-weight:500;color:var(--accent);background:var(--accent-soft);border:0;border-radius:6px;padding:7px 12px;cursor:pointer}
footer{font-size:12.5px;color:var(--muted)}
.readonly .del,.readonly .add{display:none}
@media (prefers-reduced-motion: reduce){.bar span{transition:none}}

<script id="app">
(function(){
  var DOC_HEAD='<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,-apple-system,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style></head><body>';
  var FONTS='<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,650&family=IBM+Plex+Mono:wght@400&family=IBM+Plex+Sans:wght@400;500&display=swap">';
  var state;
  try{ state=JSON.parse(document.getElementById('state').textContent); }catch(e){ state={updated:null,phases:[]}; }
  var styleText=document.getElementById('page-style').textContent;
  var appText=document.getElementById('app').textContent;
  var root=document.getElementById('root');
  var ns=null, canSave=null, status='idle', timer=null, retried=false, dirty=false;

  function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
  function totals(){var d=0,t=0;state.phases.forEach(function(p){p.tasks.forEach(function(x){t++;if(x.done)d++;});});return {d:d,t:t};}
  function fmtDate(iso){try{return new Date(iso).toLocaleString(undefined,{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});}catch(e){return '';}}
  function statusText(){
    switch(status){
      case 'pending': return ['Unsaved changes',false];
      case 'saving': return ['Saving…',false];
      case 'readonly': return ['View only: your changes are not saved',true];
      case 'local': return ['Saving is not available in this view; ticks last until you reload',true];
      case 'conflict': return ['Someone saved a newer version first. Loading it…',true];
      case 'error': return ['Could not save. Your next change will try again',true];
      default: return [state.updated?('Saved '+fmtDate(state.updated)):'Tick tasks as you finish them; changes save automatically',false];
    }
  }
  function phaseHTML(p,i){
    var d=p.tasks.filter(function(x){return x.done;}).length;
    var items=p.tasks.map(function(x){
      var cid='c-'+x.id;
      return '<li class="'+(x.done?'done':'')+'" data-key="'+esc(x.id)+'"><input type="checkbox" class="check" id="'+cid+'" data-toggle="'+esc(x.id)+'"'+(x.done?' checked':'')+' aria-label="Mark done"><label class="txt" for="'+cid+'">'+esc(x.text)+'</label><button class="del" type="button" data-del="'+esc(x.id)+'" aria-label="Remove task" title="Remove task">×</button></li>';
    }).join('');
    return '<section class="phase"><div class="ph-head"><span class="num">'+String(i+1).padStart(2,'0')+'</span><h2>'+esc(p.title)+'</h2><span class="ph-count'+(p.tasks.length&&d===p.tasks.length?' full':'')+'">'+d+'/'+p.tasks.length+'</span></div>'+
      (p.note?'<p class="note">'+esc(p.note)+'</p>':'')+
      '<ul>'+items+'</ul>'+
      '<form class="add" data-add="'+esc(p.id)+'"><input id="add-'+esc(p.id)+'" type="text" placeholder="Add a task" aria-label="Add a task to '+esc(p.title)+'" maxlength="300"><button type="submit">Add</button></form></section>';
  }
  function bodyHTML(){
    var t=totals(), pct=t.t?Math.round(t.d/t.t*100):0, st=statusText();
    return '<header><span class="eyebrow">Food space map · GIFT × nutrient fractions × semantics</span><h1>Food Space Tasks</h1>'+
      '<p class="lede">Cluster and visualize a dietary database by GIFT group and subgroup, nutrient content, nutrient fractions such as casein vs whey, and food-name semantics.</p>'+
      '<div class="meter"><div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="'+pct+'"><span style="width:'+pct+'%"></span></div><span class="count">'+t.d+' of '+t.t+' done</span></div>'+
      '<span class="status'+(st[1]?' warn':'')+'" aria-live="polite">'+esc(st[0])+'</span></header>'+
      '<div class="phases">'+state.phases.map(phaseHTML).join('')+'</div>'+
      '<footer>Phases run in order, but scope decisions in phase 1 can be revisited at any point.</footer>';
  }
  function render(){
    var a=document.activeElement, keep=a&&a.id?a.id:null, val=null;
    if(keep&&a.tagName==='INPUT'&&a.type==='text') val=a.value;
    root.innerHTML=bodyHTML();
    root.classList.toggle('readonly',canSave===false&&status==='readonly');
    if(keep){var el=document.getElementById(keep);if(el){el.focus();if(val!==null)el.value=val;}}
  }
  function buildDoc(){
    var json=JSON.stringify(state).replace(/</g,'\\u003c');
    var s=status; status='idle'; var body=bodyHTML(); status=s;
    return DOC_HEAD+'<title>Food Space Tasks</title>\n<meta name="claude:viewport-fit-sides" content="cover">\n<style id="page-style">'+styleText+'</style>\n'+FONTS+'\n<main id="root" class="wrap">'+body+'</main>\n<script type="application/json" id="state">'+json+'<\/script>\n<script id="app">'+appText+'<\/script>\n</body></html>';
  }
  function setStatus(s){status=s;render();}
  function schedule(){
    dirty=true;
    if(canSave===false){setStatus(status==='readonly'?'readonly':'local');return;}
    setStatus('pending');
    clearTimeout(timer);timer=setTimeout(save,1800);
  }
  function save(){
    if(!dirty)return;
    if(!ns){ if(canSave===false){setStatus('local');} return; }
    var prev=state.updated;
    state.updated=new Date().toISOString();
    status='saving';render();
    ns.publish(buildDoc()).then(function(){dirty=false;}).catch(function(e){
      var c=e&&e.code;
      state.updated=prev;
      if(c==='conflict'){setStatus('conflict');return;}
      if(['not_writer','not_granted','not_declared','consent_required','capability_disabled','capability_removed'].indexOf(c)>-1){canSave=false;setStatus('readonly');return;}
      if(c==='upstream_error'&&!retried){retried=true;clearTimeout(timer);timer=setTimeout(save,800+Math.random()*1200);return;}
      setStatus('error');
    });
  }
  function find(id){for(var i=0;i<state.phases.length;i++){var p=state.phases[i];for(var j=0;j<p.tasks.length;j++){if(p.tasks[j].id===id)return {p:p,j:j};}}return null;}
  function newId(){var n=0;state.phases.forEach(function(p){p.tasks.forEach(function(x){var m=/^t(\d+)$/.exec(x.id);if(m)n=Math.max(n,+m[1]);});});return 't'+(n+1);}

  root.addEventListener('change',function(e){
    var id=e.target.getAttribute&&e.target.getAttribute('data-toggle'); if(!id)return;
    var f=find(id); if(!f)return; f.p.tasks[f.j].done=e.target.checked; schedule();
  });
  root.addEventListener('click',function(e){
    var b=e.target.closest&&e.target.closest('[data-del]'); if(!b)return;
    var f=find(b.getAttribute('data-del')); if(!f)return; f.p.tasks.splice(f.j,1); schedule();
  });
  root.addEventListener('submit',function(e){
    var form=e.target.closest('[data-add]'); if(!form)return; e.preventDefault();
    var input=form.querySelector('input'), text=(input.value||'').trim(); if(!text)return;
    var pid=form.getAttribute('data-add');
    state.phases.forEach(function(p){if(p.id===pid)p.tasks.push({id:newId(),text:text,done:false});});
    input.value=''; schedule();
  });

  render();
  if(window.claude&&typeof window.claude.use==='function'){
    window.claude.use('artifact').then(function(x){
      ns=x; if(!x){canSave=false; if(dirty)setStatus('local'); return;}
      canSave=true; if(dirty){clearTimeout(timer);timer=setTimeout(save,600);}
    },function(){canSave=false;if(dirty)setStatus('local');});
  } else { canSave=false; }
})();
</script>
